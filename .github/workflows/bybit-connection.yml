name: BOT FIN - Bybit Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bybit-connection-test:
    name: Test Bybit EU Connection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout BOT FIN
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Bybit connection test
        env:
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python bybit_check.py
